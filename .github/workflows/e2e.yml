# Teste de ponta a ponta: instala a última versão publicada num Windows limpo,
# usa o app como um usuário e publica prints + relatório na branch e2e-results.
name: E2E

on:
  push:
    branches: [e2e]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar o instalador da última versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].assets[] | select(.name | test("Setup")) | .browser_download_url')
          echo "Instalador: $url"
          curl -sSL -o setup.exe "$url"
          ls -la setup.exe

      - name: Instalar em silêncio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          $log = 'e2e-out\install.txt'
          $f = Get-Item .\setup.exe
          "setup.exe: $($f.Length) bytes, SHA256 $((Get-FileHash $f).Hash)" | Tee-Object -FilePath $log
          (Get-AuthenticodeSignature $f).Status | Out-String | Tee-Object -FilePath $log -Append
          [Environment]::OSVersion | Out-String | Tee-Object -FilePath $log -Append
          $tries = @(@('/S'), @('/S','/currentuser'), @('/S','/allusers'))
          $exe = $null
          foreach ($a in $tries) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $f.FullName -ArgumentList $a -Wait -PassThru
            "Tentativa '$($a -join ' ')': código $($p.ExitCode) ($('{0:X8}' -f $p.ExitCode)) em $([int]$sw.Elapsed.TotalSeconds) s" | Tee-Object -FilePath $log -Append
            for ($i = 0; $i -lt 20 -and -not $exe; $i++) {
              $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles","${env:ProgramFiles(x86)}" -Recurse -Filter 'Tomodachi Player.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $exe) { Start-Sleep -Seconds 3 }
            }
            if ($exe) { break }
          }
          "--- Eventos de erro de aplicativo (falhas) ---" | Tee-Object -FilePath $log -Append
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001,1026} -MaxEvents 6 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message | Out-String -Width 400 | Tee-Object -FilePath $log -Append
          if ($exe) {
            "INSTALOU: $($exe.FullName)" | Tee-Object -FilePath $log -Append
          } else {
            "Instalador falhou; extraindo o app do instalador com 7-Zip para testar mesmo assim" | Tee-Object -FilePath $log -Append
            $dir = "$env:RUNNER_TEMP\tp-extract"
            7z x $f.FullName "-o$dir\nsis" -y | Out-Null
            $pkg = Get-ChildItem "$dir\nsis" -Recurse -Filter 'app-64.7z' | Select-Object -First 1
            7z x $pkg.FullName "-o$dir\app" -y | Out-Null
            $exe = Get-Item "$dir\app\Tomodachi Player.exe"
          }
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "APP_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          "Executável: $($exe.FullName)" | Tee-Object -FilePath $log -Append

      - name: Criar mídia de teste (vídeo + páginas)
        shell: pwsh
        run: |
          $ff = Get-ChildItem "$env:APP_DIR\resources" -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $media = "$env:RUNNER_TEMP\tp-media"
          New-Item -ItemType Directory -Force "$media\tp-videos","$media\manga" | Out-Null
          & $ff.FullName -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$media\tp-videos\sample.mp4"
          1..6 | ForEach-Object { & $ff.FullName -hide_banner -loglevel error -f lavfi -i "testsrc=size=800x1150" -frames:v 1 ("$media\manga\{0:D3}.png" -f $_) }
          Get-ChildItem -Recurse $media | Select-Object FullName, Length
          "MEDIA_DIR=$media" >> $env:GITHUB_ENV

      - name: Instalar Playwright
        run: npm i --no-save --no-audit --no-fund playwright@1.49.1

      - name: Rodar o teste
        run: node e2e/run.mjs
        continue-on-error: true

      - name: Juntar logs do app
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          Get-ChildItem "$env:APPDATA" -Directory | Where-Object { $_.Name -match 'Tomodachi|manga-video' } | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | Copy-Item -Destination e2e-out -ErrorAction SilentlyContinue
          }

      - name: Publicar resultado na branch e2e-results
        if: always()
        shell: bash
        run: |
          cd e2e-out
          git init -q -b e2e-results
          git config user.name "e2e-bot"
          git config user.email "e2e-bot@users.noreply.github.com"
          echo "run ${{ github.run_id }}" > run.txt
          git add -A
          git commit -q -m "E2E ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-results
