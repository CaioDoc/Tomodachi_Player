# Pacote de teste: monta o instalador da branch "dev" e guarda num RASCUNHO de release.
# Rascunhos só aparecem para o dono do repositório e não são vistos pela atualização automática,
# então dá para testar antes de soltar. Para soltar, é só publicar o rascunho (ou levar a versão para a main).
name: Package (test)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-dev
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci || npm install
      - name: Compilar
        run: npm run build
      - name: Empacotar
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Ler a versão
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Apagar o rascunho anterior desta versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '.[] | select(.draft and .tag_name=="${{ steps.ver.outputs.tag }}") | .id' | while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
      - name: Instalar o pacote (como um usuário faria)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          $setup = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = $null
          for ($i = 0; $i -lt 40 -and -not $exe; $i++) { $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Tomodachi Player.exe' -ErrorAction SilentlyContinue | Select-Object -First 1; if (-not $exe) { Start-Sleep 3 } }
          "Instalado: $($exe.VersionInfo.ProductVersion) em $($exe.FullName)" | Tee-Object e2e-out\install.txt
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          $ff = Get-ChildItem "$($exe.DirectoryName)\resources" -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $media = "$env:RUNNER_TEMP\tp-media"
          New-Item -ItemType Directory -Force "$media\tp-videos" | Out-Null
          & $ff.FullName -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$media\tp-videos\sample.mp4"
          # Outros formatos: MKV com H.264 (só reempacota), AVI com MPEG-4 (converte) e MP4 com áudio AC3 (Chromium tocaria mudo)
          New-Item -ItemType Directory -Force "$media\tp-formats" | Out-Null
          & $ff.FullName -hide_banner -loglevel error -i "$media\tp-videos\sample.mp4" -c copy "$media\tp-formats\fmt-mkv.mkv"
          & $ff.FullName -hide_banner -loglevel error -i "$media\tp-videos\sample.mp4" -c:v mpeg4 -q:v 5 -c:a libmp3lame "$media\tp-formats\fmt-avi.avi"
          & $ff.FullName -hide_banner -loglevel error -i "$media\tp-videos\sample.mp4" -c:v copy -c:a ac3 "$media\tp-formats\fmt-ac3.mp4"
          Get-ChildItem "$media\tp-formats" | Select-Object Name, Length | Out-String | Tee-Object e2e-out\formats.txt
          "MEDIA_DIR=$media" >> $env:GITHUB_ENV
      - name: Testar o pacote de ponta a ponta
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          node e2e/run.mjs
        continue-on-error: true
      - name: Publicar o relatório do teste
        if: always()
        shell: bash
        run: |
          mkdir -p e2e-out && cd e2e-out
          git init -q -b r
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -q -m r --allow-empty
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" r:e2e-results-dev
      - name: Guardar no rascunho de release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Tomodachi Player ${{ steps.ver.outputs.tag }} (pacote de teste)
          body: |
            Pacote de teste da branch dev (commit ${{ github.sha }}). Ainda não publicado.
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
