# Instala uma versão antiga e confere se o app se atualiza sozinho para a última publicada.
name: Update test

on:
  push:
    branches: [e2e-update]

permissions:
  contents: write

env:
  FROM_TAG: v1.6.1-beta

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Baixar e instalar a versão antiga
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force update-out | Out-Null
          $url = gh api "repos/${{ github.repository }}/releases/tags/$env:FROM_TAG" --jq '.assets[] | select(.name | test("Setup")) | .browser_download_url'
          $latest = gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name'
          "De $env:FROM_TAG para a última publicada: $latest" | Tee-Object update-out\result.txt
          curl.exe -sSL -o old-setup.exe $url
          Start-Process .\old-setup.exe -ArgumentList '/S' -Wait
          $exe = $null
          for ($i = 0; $i -lt 40 -and -not $exe; $i++) { $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Tomodachi Player.exe' -ErrorAction SilentlyContinue | Select-Object -First 1; if (-not $exe) { Start-Sleep 3 } }
          "Instalada: $($exe.VersionInfo.ProductVersion) em $($exe.FullName)" | Tee-Object update-out\result.txt -Append
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1
      - name: Abrir o app antigo e deixar ele se atualizar
        run: node e2e/update.mjs
        continue-on-error: true
      - name: Conferir a versão instalada depois
        shell: pwsh
        run: |
          $ver = ''
          for ($i = 0; $i -lt 60; $i++) {
            $exe = Get-Item $env:APP_EXE -ErrorAction SilentlyContinue
            $ver = $exe.VersionInfo.ProductVersion
            if ($ver -and $ver -notlike '1.6.1*') { break }
            Start-Sleep 3
          }
          "Versão instalada depois: $ver" | Tee-Object update-out\result.txt -Append
          $running = Get-Process -Name 'Tomodachi Player' -ErrorAction SilentlyContinue
          "App aberto de novo após atualizar: $([bool]$running)" | Tee-Object update-out\result.txt -Append
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APPDATA\Tomodachi Player\logs" -Filter *.log -ErrorAction SilentlyContinue | Copy-Item -Destination update-out
          Get-ChildItem "$env:LOCALAPPDATA\tomodachi-player-updater","$env:LOCALAPPDATA\manga-video-hub-updater" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String | Tee-Object update-out\result.txt -Append
      - name: Publicar
        if: always()
        shell: bash
        run: |
          cd update-out
          git init -q -b r
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -q -m r --allow-empty
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" r:update-results
