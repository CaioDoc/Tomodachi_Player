# Gera os executáveis do Windows e publica na página de Releases.
#
# Como lançar uma versão:
#   1. Atualize "version" no package.json (ex.: 1.5.6-beta)
#   2. Crie e envie uma tag com o mesmo número: v1.5.6-beta
# O GitHub monta o instalador e a versão portátil sozinho e cria a Release.
# Tags com "beta" ou "alpha" saem marcadas como pré-lançamento.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Compilar
        run: npm run build

      - name: Empacotar (instalador + portátil)
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Guardar os executáveis no workflow
        uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-Player-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Tomodachi Player ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: release/*.exe
