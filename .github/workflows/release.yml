# Gera os executáveis do Windows e publica na página de Releases.
#
# Como lançar uma versão:
#   1. Atualize "version" no package.json (ex.: 1.5.6-beta)
#   2. Envie para a branch main
# Se ainda não existir uma Release "v<versão>", o GitHub monta o instalador e a
# versão portátil num Windows limpo e cria a Release com esses arquivos.
# Versões com "beta" ou "alpha" saem marcadas como pré-lançamento.
# (Também funciona enviando uma tag v*, ou pelo botão "Run workflow" na aba Actions.)

name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler a versão
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "A versão $TAG já foi publicada; nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$VERSION" == *beta* || "$VERSION" == *alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar o Node.js
        if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        if: steps.ver.outputs.skip != 'true'
        run: npm ci || npm install

      - name: Compilar
        if: steps.ver.outputs.skip != 'true'
        run: npm run build

      - name: Empacotar (instalador + portátil)
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Guardar os executáveis no workflow
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tomodachi-Player-Windows
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error

      - name: Publicar na página de Releases
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Tomodachi Player ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          # .yml e .blockmap: usados pela atualização automática do app (electron-updater)
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
            release/alpha*.yml
